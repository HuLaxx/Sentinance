name: P0 Frontend remediation candidate
on:
  push:
    branches: ['feat/p1-local-parquet-provenance-2026-11-17']
  pull_request:
    branches: ['feat/p1-source-sequence-backfill-2026-11-17']
permissions:
  contents: read
jobs:
  candidate:
    if: github.event_name == 'push' || github.head_ref == 'feat/p1-local-parquet-provenance-2026-11-17'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve a candidate without changing the committed lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev --save-exact vitest@5.1.0 @vitest/coverage-v8@5.1.0 @vitest/ui@5.1.0 vite@7.3.8
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm ci --no-audit --no-fund
      - name: Test candidate compatibility
        run: |
          npm run lint
          npx --no-install tsc --noEmit
          npm run test:ci
          npm run build
      - name: Audit candidate without weakening original gate
        if: always()
        run: |
          npm audit --json > candidate-full.json || true
          npm audit --omit=dev --json > candidate-production.json || true
          node scripts/audit-summary.mjs candidate-full.json candidate-production.json
      - name: Preserve candidate for human inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinance-remediation-candidate
          path: |
            apps/web/package.json
            apps/web/package-lock.json
            apps/web/candidate-full.json
            apps/web/candidate-production.json
          if-no-files-found: error
          retention-days: 7
