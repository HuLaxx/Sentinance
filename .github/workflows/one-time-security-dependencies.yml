name: One-Time Security Dependency Upgrade (review branch only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-time-security-dependencies.yml'

permissions:
  contents: write

concurrency:
  group: sentinance-one-time-security-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/p0-ci-evidence-2026-11-12'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade vulnerable Next.js dependencies and update lockfile
        working-directory: apps/web
        run: |
          npm ci
          npm install --save-exact next@16.4.6 eslint-config-next@16.4.6
          npm ls next eslint-config-next
      - name: Commit exact package and lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): update Next.js and ESLint config to 16.4.6"
            git push origin HEAD:audit/p0-ci-evidence-2026-11-12
          fi
