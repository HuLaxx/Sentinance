# ============================================
# SENTINANCE - PR CHECKS WORKFLOW
# ============================================
# Runs on pull requests to check code quality

name: PR Checks

on:
  push:
    branches: ['fix/**']
  pull_request:
    branches: [main, develop, 'audit/**', 'fix/**']

jobs:
  # ==========================================
  # CODE QUALITY CHECKS
  # ==========================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python tools
        run: pip install ruff mypy

      - name: Install Node dependencies
        working-directory: apps/web
        run: npm ci

      - name: Check Python formatting
        id: python_format
        continue-on-error: true
        working-directory: apps/api
        run: ruff format --check .

      - name: Check Python linting
        id: python_lint
        continue-on-error: true
        working-directory: apps/api
        run: ruff check . --extend-select E402

      - name: Check TypeScript linting
        id: ts_lint
        continue-on-error: true
        working-directory: apps/web
        run: npm run lint

      - name: Enforce PR quality gate
        if: always()
        env:
          FORMAT_RESULT: ${{ steps.python_format.outcome }}
          PY_LINT_RESULT: ${{ steps.python_lint.outcome }}
          TS_LINT_RESULT: ${{ steps.ts_lint.outcome }}
        run: |
          echo "Format: $FORMAT_RESULT | Python lint: $PY_LINT_RESULT | Web lint: $TS_LINT_RESULT"
          test "$FORMAT_RESULT" = success
          test "$PY_LINT_RESULT" = success
          test "$TS_LINT_RESULT" = success

  # ==========================================
  # SECURITY SCAN
  # ==========================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"  # High/critical issues are release blockers

  # ==========================================
  # COMMIT MESSAGE CHECK
  # ==========================================
  commit-lint:
    name: Commit Message Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate actual PR commit messages
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          count=0
          while IFS= read -r subject; do
            count=$((count + 1))
            if ! grep -Eq '^(feat|fix|docs|chore|ci|test|refactor|perf|style|build|revert|safety)(\([a-zA-Z0-9_/-]+\))?: .+$' <<< "$subject"; then
              echo "Invalid commit message: $subject"
              exit 1
            fi
          done < <(git log --format=%s "$PR_BASE_SHA..$PR_HEAD_SHA")
          echo "Validated $count PR commit messages"
          test "$count" -gt 0
