name: One-time Sentinance P0 formatter

on:
  push:
    branches:
      - fix/sentinance-p0-quality-2026-11-13
    paths:
      - .github/workflows/pr-quality-autofix-once.yml

permissions:
  contents: write

jobs:
  safe-python-autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: fix/sentinance-p0-quality-2026-11-13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned formatter
        run: python -m pip install 'ruff==0.17.5'
      - name: Apply deterministic safe fixes
        working-directory: apps/api
        run: |
          ruff check --fix . || true
          ruff format .
          ruff check --fix . || true
          ruff format --check .
          git diff --stat
      - name: Commit changes only to this review branch
        run: |
          git diff --check
          git add -- apps/api
          if git diff --cached --quiet; then
            echo "No autofix changes found"
            exit 0
          fi
          test "$(git branch --show-current)" = "fix/sentinance-p0-quality-2026-11-13"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(api): apply Ruff formatting and safe fixes [skip ci]"
          git push origin HEAD:refs/heads/fix/sentinance-p0-quality-2026-11-13
