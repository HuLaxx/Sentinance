# Real Kafka -> PostgreSQL durable price event, commit/replay and migration.
# Isolated disposable CI services; no external exchange or cloud credentials.
name: P1 Durable Kafka PostgreSQL

on:
  pull_request:
    branches: [main, 'fix/**', 'feat/**']
    paths:
      - 'apps/api/kafka_consumer.py'
      - 'apps/api/kafka_producer.py'
      - 'apps/api/kafka_price_models.py'
      - 'apps/api/durable_price_ingestion.py'
      - 'apps/api/price_event_contract.py'
      - 'apps/api/binance_aggtrades_v1.py'
      - 'apps/api/binance_ingest_once.py'
      - 'apps/api/routers/market_event_router.py'
      - 'apps/api/tests/integration/test_p1_source_kafka_postgres.py'
      - 'apps/api/migrations/**'
      - 'apps/api/tests/integration/test_p1_kafka_postgres_replay.py'
      - '.github/workflows/p1-durable-kafka-postgres.yml'

permissions:
  contents: read

jobs:
  durable-price-ledger:
    name: Kafka ack/replay + real Postgres ledger
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      kafka:
        image: apache/kafka:3.9.1
        ports:
          - 9092:9092
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused ingestion and migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiokafka==0.10.0 structlog==23.2.0 \
            SQLAlchemy==2.0.23 asyncpg==0.29.0 alembic==1.13.0 \
            python-dotenv==1.0.0 pytest==7.4.3 pytest-asyncio==0.21.1 \
            httpx==0.25.2 fastapi==0.104.1

      - name: Apply actual Alembic migrations to disposable PostgreSQL
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sentinance_test
        run: alembic upgrade head

      - name: Assert migrated raw ledger exists
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sentinance_test
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy import inspect
          from database import engine
          async def check():
              async with engine.connect() as conn:
                  tables = await conn.run_sync(
                      lambda connection: inspect(connection).get_table_names()
                  )
                  assert 'raw_kafka_price_events' in tables, tables
              await engine.dispose()
          asyncio.run(check())
          PY

      - name: Assert broker replay and duplicate-safe PostgreSQL write
        working-directory: apps/api
        timeout-minutes: 6
        env:
          P1_BROKER_POSTGRES_INTEGRATION: '1'
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sentinance_test
        run: |
          PYTHONPATH=. pytest -q -o addopts="" \
            tests/integration/test_p1_kafka_postgres_replay.py \
            tests/integration/test_p1_source_kafka_postgres.py
