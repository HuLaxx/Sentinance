name: One-Time Transitive Security Lockfile Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-time-transitive-security.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/p0-ci-evidence-2026-11-12'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile with patched transitive dependency overrides
        working-directory: apps/web
        run: |
          npm install --package-lock-only
          npm ci
          npm ls next jsondiffpatch source-map-js
      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): lock patched transitive JavaScript dependencies"
            git push origin HEAD:audit/p0-ci-evidence-2026-11-12
          fi
