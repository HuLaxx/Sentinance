<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" role="img" aria-labelledby="t d">
<title id="t">Sentinance system map — signal to insight</title>
<desc id="d">Conceptual architecture: exchange data enters ingestion, FastAPI APIs connect to the Next.js interface; optional agent and forecasting paths use modular components. Kafka, Redis, and Qdrant are infrastructure options with fallback behaviour.</desc>
