 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#81e8e0"/></marker>
 <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8fc9e0" stroke-opacity=".07"/></pattern>
 <clipPath id="mask"><rect width="1100" height="550" rx="18"/></clipPath>
</defs>
<g clip-path="url(#mask)">
<rect width="1100" height="550" fill="url(#bg)"/><rect width="1100" height="550" fill="url(#g)"/>
